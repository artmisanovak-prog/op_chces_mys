<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoř · ROOM</title><style>
:root{--ink:#20251f;--paper:#f3f0e7;--line:#d6d1c5;--acid:#c7f27a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:22px clamp(16px,4vw,40px);background:var(--ink);color:white}header a{color:var(--acid)}h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1;margin:.4em 0}main{max-width:1100px;margin:auto;padding:20px 15px 50px}.layout{display:grid;grid-template-columns:minmax(230px,1fr) minmax(280px,2fr);gap:14px}@media(max-width:700px){.layout{grid-template-columns:1fr}}.panel{background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}label{display:block;font-weight:650;margin:10px 0 4px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white}textarea{min-height:80px}button{background:var(--ink);color:white;border:0;border-radius:7px;padding:9px 12px;margin:4px 4px 4px 0;cursor:pointer}.secondary{background:#e5e2d8;color:var(--ink)}.item{display:block;width:100%;text-align:left;background:white;color:var(--ink);border:1px solid var(--line)}.item.active{border:2px solid var(--ink);background:#edf2e4}.muted{font-size:.88rem;color:#65685f}.row{display:flex;gap:5px;flex-wrap:wrap}</style></head><body><header><a href="index.html">← ROOM</a><h1>Laboratoř pokusů</h1><div>Větvení bez přepisování rodiče. Pozorování není totéž co interpretace.</div></header><main><div class="row"><button id="new">+ Nový pokus</button><button id="branch">Vytvořit větev</button><button class="secondary" id="export">Export JSON</button><button class="secondary" id="import">Import JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><div class="layout"><section class="panel"><h2>Záznamy</h2><div id="list"></div><p class="muted">Data jsou v localStorage tohoto prohlížeče. Přenos mezi zařízeními zajišťuje export/import JSON.</p></section><section class="panel"><h2>Detail</h2><label for="title">Název</label><input id="title"><label for="parent">Rodičovský záznam</label><input id="parent" readonly><label for="question">Zadání</label><textarea id="question"></textarea><label for="model">Model / rozhraní</label><input id="model"><label for="instruction">Instrukce / metoda / verze</label><textarea id="instruction"></textarea><label for="input">Vstupy / karty</label><textarea id="input"></textarea><label for="output">Výstup</label><textarea id="output"></textarea><label for="observation">Pozorování</label><textarea id="observation"></textarea><label for="hypothesis">Hypotéza / interpretace</label><textarea id="hypothesis"></textarea><label for="test">Test / kritérium úspěchu</label><textarea id="test"></textarea><label for="result">Stav</label><select id="result"><option>nezahájeno</option><option>čeká na test</option><option>podpořeno pozorováním</option><option>nepodpořeno</option><option>neprůkazné</option><option>funkční prototyp</option></select><div class="row"><button id="save">Uložit</button><button class="secondary" id="link">Odkaz na záznam</button><button class="secondary" id="delete">Smazat</button></div><p id="status" class="muted" aria-live="polite"></p></section></div></main><script>
const $=id=>document.getElementById(id),KEY='mouse_room_records',fields=['title','parent','question','model','instruction','input','output','observation','hypothesis','test','result'];let records=[],selected=null;
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function cur(){return records.find(x=>x.id===selected)}
function render(){let box=$('list');box.innerHTML='';if(!records.length)box.textContent='Zatím žádné pokusy.';records.slice().reverse().forEach(r=>{let b=document.createElement('button');b.className='item'+(r.id===selected?' active':'');let t=document.createElement('strong');t.textContent=r.title||'(bez názvu)';let p=document.createElement('div');p.className='muted';p.textContent=(r.parent?'↳ větev · ':'')+(r.result||'nezahájeno')+' · '+new Date(r.updated||r.created||Date.now()).toLocaleString();b.append(t,p);b.onclick=()=>select(r.id);box.append(b)})}
function select(id){selected=id;let r=cur();if(!r)return;fields.forEach(k=>$(k).value=r[k]??'');render();history.replaceState(null,'','#'+encodeURIComponent(id))}
function create(parent=null,source=null){let r={id:'room-exp-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),created:new Date().toISOString(),updated:new Date().toISOString(),parent,title:'Nový pokus',question:'',model:'',instruction:'',input:'',output:'',observation:'',hypothesis:'',test:'',result:'nezahájeno'};if(source){['question','model','instruction','input','test'].forEach(k=>r[k]=source[k]||'');r.title=(source.title||'Pokus')+' / větev'}records.push(r);persist();select(r.id);$('status').textContent=parent?'Větev vytvořena; rodičovský záznam zůstává zachován.':'Nový záznam vytvořen.'}
$('new').onclick=()=>create();$('branch').onclick=()=>{let r=cur();if(!r){$('status').textContent='Nejdřív vyber záznam.';return}create(r.id,r)};
$('save').onclick=()=>{let r=cur();if(!r){$('status').textContent='Nejdřív vytvoř nebo vyber záznam.';return}fields.forEach(k=>r[k]=$(k).value);r.updated=new Date().toISOString();persist();$('status').textContent='Uloženo lokálně.'};
$('delete').onclick=()=>{if(!selected)return;records=records.filter(r=>r.id!==selected);selected=null;persist();fields.forEach(k=>$(k).value='');$('status').textContent='Záznam smazán.'};
$('link').onclick=()=>{if(selected){location.hash=encodeURIComponent(selected);$('status').textContent='ID záznamu je v URL. Pro sdílení dat exportuj JSON.'}};
$('export').onclick=()=>{let b=new Blob([JSON.stringify({schema:'mouse-room-records/1.0',exported:new Date().toISOString(),records},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mouse-room-pokusy.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;try{let data=JSON.parse(await f.text()),items=Array.isArray(data)?data:data.records;if(!Array.isArray(items))throw Error('Soubor neobsahuje seznam záznamů');let ids=new Set(records.map(r=>r.id));items.forEach(r=>{if(!r.id||ids.has(r.id))r.id='import-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);records.push(r)});persist();$('status').textContent='Importováno '+items.length+' záznamů.'}catch(e){$('status').textContent='Import se nezdařil: '+e.message}};
load();render();if(location.hash){let id=decodeURIComponent(location.hash.slice(1));if(records.some(r=>r.id===id))select(id)}
</script></body></html>
