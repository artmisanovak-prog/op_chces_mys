<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porovnávač · ROOM</title><style>
:root{--ink:#20251f;--paper:#f3f0e7;--line:#d6d1c5;--acid:#c7f27a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:22px clamp(16px,4vw,40px);background:var(--ink);color:white}header a{color:var(--acid)}h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1;margin:.4em 0}main{max-width:1100px;margin:auto;padding:20px 15px 50px}.panel{background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}label{display:block;font-weight:650;margin:10px 0 4px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white}textarea{min-height:150px}button{background:var(--ink);color:white;border:0;border-radius:7px;padding:9px 12px;margin:4px;cursor:pointer}.secondary{background:#e5e2d8;color:var(--ink)}.muted{color:#65685f;font-size:.9rem}</style></head><body><header><a href="index.html">← ROOM</a><h1>Porovnávač</h1><div>Stejné zadání, více modelů nebo stejný model s různými instrukcemi.</div></header><main><div class="panel"><label for="task">Společné zadání</label><textarea id="task" placeholder="Vlož přesné zadání, které bude stejné pro všechny varianty."></textarea><label for="criteria">Kritéria před porovnáním</label><textarea id="criteria" placeholder="Např. splní 3 pravidla, funguje bez serveru, testovatelný výsledek."></textarea><p class="muted">Pro férové srovnání neměň současně model, zadání i instrukci. Zaznamenej verzi modelu a případné rozdíly v limitech.</p></div><div class="cols"><div class="panel"><h2>Varianta A</h2><label for="nameA">Model / instrukce</label><input id="nameA" placeholder="např. model A · baseline"><label for="promptA">Doplňující instrukce</label><textarea id="promptA"></textarea><label for="outA">Výstup A</label><textarea id="outA"></textarea><label for="scoreA">Výsledek podle kritérií</label><textarea id="scoreA" placeholder="Pozorování, nikoli dojem"></textarea></div><div class="panel"><h2>Varianta B</h2><label for="nameB">Model / instrukce</label><input id="nameB" placeholder="např. model B · MOUSE"><label for="promptB">Doplňující instrukce</label><textarea id="promptB"></textarea><label for="outB">Výstup B</label><textarea id="outB"></textarea><label for="scoreB">Výsledek podle kritérií</label><textarea id="scoreB" placeholder="Pozorování, nikoli dojem"></textarea></div></div><div class="panel"><label for="conclusion">Rozdíly / závěr / co zatím nevíme</label><textarea id="conclusion"></textarea><button id="copy">Sestavit souhrn</button><button class="secondary" id="save">Uložit do deníku</button><button class="secondary" id="download">Export JSON</button><textarea id="summary" style="min-height:190px" placeholder="Zde se sestaví přehled pro sdílení nebo uložení."></textarea><p id="status" class="muted" aria-live="polite"></p></div></main><script>
const $=id=>document.getElementById(id);const ids=['task','criteria','nameA','promptA','outA','scoreA','nameB','promptB','outB','scoreB','conclusion'];function data(){let o={schema:'mouse-room-comparison/1.0',created:new Date().toISOString()};ids.forEach(k=>o[k]=$(k).value);return o}function summary(){let d=data();$('summary').value='POROVNÁNÍ ROOM\n\nSPOLEČNÉ ZADÁNÍ\n'+d.task+'\n\nKRITÉRIA\n'+d.criteria+'\n\nVARIANTA A · '+d.nameA+'\nInstrukce: '+d.promptA+'\nVýstup:\n'+d.outA+'\nPozorování: '+d.scoreA+'\n\nVARIANTA B · '+d.nameB+'\nInstrukce: '+d.promptB+'\nVýstup:\n'+d.outB+'\nPozorování: '+d.scoreB+'\n\nROZDÍLY / ZÁVĚR / NEJISTOTY\n'+d.conclusion;return d}
$('copy').onclick=async()=>{summary();try{await navigator.clipboard.writeText($('summary').value);$('status').textContent='Souhrn zkopírován.'}catch(e){$('summary').select();$('status').textContent='Souhrn je připravený a označený ke kopírování.'}};
$('save').onclick=()=>{let d=summary(),all=JSON.parse(localStorage.getItem('mouse_room_records')||'[]');all.push({id:'compare-'+Date.now(),type:'comparison',title:(d.nameA||'A')+' vs '+(d.nameB||'B'),created:d.created,parent:null,question:d.task,instruction:d.criteria,input:JSON.stringify({A:{name:d.nameA,prompt:d.promptA},B:{name:d.nameB,prompt:d.promptB}}),output:JSON.stringify({A:d.outA,B:d.outB}),observation:JSON.stringify({A:d.scoreA,B:d.scoreB}),hypothesis:d.conclusion,test:d.criteria,result:'čeká na vyhodnocení'});localStorage.setItem('mouse_room_records',JSON.stringify(all));$('status').textContent='Porovnání uloženo do stejného lokálního deníku jako pokusy.'};
$('download').onclick=()=>{let b=new Blob([JSON.stringify(summary(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='room-porovnani.json';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
