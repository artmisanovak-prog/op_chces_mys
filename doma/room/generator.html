<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generátor · ROOM</title><style>
:root{--ink:#20251f;--paper:#f3f0e7;--line:#d6d1c5;--acid:#c7f27a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{padding:22px clamp(16px,4vw,40px);background:var(--ink);color:white}header a{color:var(--acid)}h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1;margin:.4em 0}main{max-width:1000px;margin:auto;padding:22px 16px 60px}.panel{background:#fffdf7;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}label{display:block;font-weight:650;margin:10px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:7px;background:var(--ink);color:white;padding:10px 13px;margin:4px 5px 4px 0;cursor:pointer}.secondary{background:#e5e2d8;color:var(--ink)}.muted{color:#62665d;font-size:.9rem}.animal{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}.animal img{width:100%;border-radius:10px;border:1px solid var(--line)}.animal a{color:inherit}@media(max-width:500px){.animal{grid-template-columns:100px 1fr}}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#20251f;color:#f4f1e8;padding:14px;border-radius:9px}.actions{display:flex;gap:7px;flex-wrap:wrap}</style></head><body><header><a href="index.html">← ROOM</a><h1>Generátor</h1><div>Ilustrace + pohádka + tři vstupy → přenosné zadání pro model.</div></header><main>
<div class="panel"><div class="cols"><div><label for="animal">Karta ze slovníku</label><select id="animal"></select><div id="source" class="animal" style="margin-top:14px"></div></div><div><label for="angle">Úhel / způsob čtení</label><select id="angle"><option>Analytický</option><option>Kulturní</option><option>Filozofický</option><option>Naivní</option><option>Jazykový</option><option>Metaforický</option><option>Asociační</option><option>Introspektivní</option><option>Ironický</option><option>Groteskní</option><option>Absurdní</option><option>Surrealistický</option><option>Neurčený / vlastní</option></select><label for="sentence">Generativní věta / vlastní čtení</label><textarea id="sentence" placeholder="Vlož generativní větu ke kartě."></textarea></div></div>
<div class="cols"><div><label for="second">Druhý vstup</label><textarea id="second" placeholder="Další karta, věta nebo mechanismus"></textarea><label for="third">Třetí vstup</label><textarea id="third" placeholder="Třetí karta, věta nebo omezení"></textarea></div><div><label for="goal">Co má vzniknout?</label><select id="goal"><option>funkční nástroj</option><option>herní mechanika</option><option>pravidla pro jiný systém</option><option>hra nebo herní prostředí</option><option>quest / úkol</option><option>postava s pravidly chování</option><option>vědecká hypotéza a test</option><option>interaktivní prototyp</option><option>jiný typ výstupu</option></select><label for="operation">Generativní operace</label><select id="operation"><option>Kompozice: tři vstupy mají tři odlišné funkce</option><option>Konflikt: pravidla vstupů se střetnou</option><option>Inverze: obrať běžnou funkci</option><option>Ztráta informace: co se změní, když část chybí</option><option>Zpětná vazba: výsledek mění další vstup</option><option>Změna měřítka: mikro ↔ makro</option><option>Překlad mezi doménami</option><option>Protipříklad: najdi podmínku selhání</option></select><label for="constraints">Omezení a cílové prostředí</label><textarea id="constraints" placeholder="Např. bez backendu, ověřitelné v jedné HTML stránce"></textarea></div></div>
<div class="actions"><button id="generate">Vytvořit prompt</button><button class="secondary" id="url">Stav do URL</button><button class="secondary" id="copy">Kopírovat prompt</button><button class="secondary" id="download">Export JSON</button></div></div>
<div class="panel"><label for="prompt">Prompt pro libovolný model</label><textarea id="prompt" style="min-height:280px"></textarea><label for="draft">Pracovní výstup / poznámky</label><textarea id="draft" placeholder="Vlož výstup modelu nebo svůj návrh."></textarea><div class="actions"><button id="save">Uložit jako pokus</button><a href="laborator.html">Otevřít laboratoř →</a><a href="porovnani.html">Porovnat výstupy →</a></div><p id="status" class="muted" aria-live="polite"></p></div></main>
<script>
const animals=[['mys','Myš','mys.txt'],['kocour','Kocour','kocour.txt'],['ryba','Ryba','ryba.txt'],['zajic','Zajíc','zajic.txt'],['pavouk','Pavouk','pavouk.txt'],['plamenak','Plameňák','plamenak.txt'],['panda','Panda','panda.txt'],['vlk','Vlk','vlk.txt'],['cap','Čáp','cap.txt'],['drak','Drak','drak.txt'],['had','Had','had.txt'],['husy','Husy','husy.txt'],['hvezdice','Hvězdice','hvezdice.txt'],['hyena','Hyena','hyeny.txt'],['jednorozec','Jednorožec','jednorozec.txt'],['kravy','Krávy','kravy.txt'],['krokodyl','Krokodýl','krokodyl.txt'],['lemur','Lemur','lemur.txt'],['liska','Liška','liska.txt'],['motyl','Motýl','motyl.txt'],['netopyr','Netopýr','netopyr.txt'],['osel','Osel','osel.txt'],['pav','Páv','pav.txt'],['parohy','Parohy','parohy.txt'],['slon','Slon','slon.txt'],['tygr','Tygr','tygr.txt'],['veverka','Veverka','veverka.txt'],['zelva','Želva','zelva.txt'],['zralok','Žralok','zralok.txt']];
const $=id=>document.getElementById(id);const animal=$('animal');animals.forEach(a=>{let o=document.createElement('option');o.value=a[0];o.textContent=a[1];animal.append(o)});
function showSource(){let a=animals.find(x=>x[0]===animal.value);let src=document.getElementById('source');src.innerHTML='';let img=document.createElement('img');img.src='../chces_mys/ilustrace/'+a[0]+'.jpg';img.alt='Ilustrace: '+a[1];img.onerror=()=>{img.style.display='none'};src.append(img);let box=document.createElement('div');let strong=document.createElement('strong');strong.textContent=a[1];box.append(strong);let p=document.createElement('p');p.textContent='Ilustrace a pohádka jsou čtené z původní složky doma/chces_mys.';box.append(p);let tale=document.createElement('a');tale.href='../chces_mys/kriva_pohadka/'+(a[2]||a[0]+'.txt');tale.textContent='Otevřít pohádku ↗';tale.target='_blank';tale.rel='noopener';box.append(tale);src.append(box)}
animal.onchange=showSource;showSource();
function state(){return {animal:animal.value,angle:$('angle').value,sentence:$('sentence').value,second:$('second').value,third:$('third').value,goal:$('goal').value,operation:$('operation').value,constraints:$('constraints').value,prompt:$('prompt').value,draft:$('draft').value}}
function encode(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))))}
function apply(s){if(!s)return;Object.keys(s).forEach(k=>{if($(k))$(k).value=s[k]});showSource()}
function generate(){let s=state(),a=animals.find(x=>x[0]===s.animal);$('prompt').value='ROLE: Navrhuj testovatelné systémy, ne pouze textové metafory.\n\nZDROJOVÁ KARTA: '+a[1]+'\nILUSTRACE: ../chces_mys/ilustrace/'+a[0]+'.jpg\nPOHÁDKA: ../chces_mys/kriva_pohadka/'+(a[2]||a[0]+'.txt')+'\nÚHEL: '+s.angle+'\nGENERATIVNÍ VĚTA: '+(s.sentence||'(nezadána)')+'\nDRUHÝ VSTUP: '+(s.second||'(nezadán)')+'\nTŘETÍ VSTUP: '+(s.third||'(nezadán)')+'\nCÍL: '+s.goal+'\nOPERACE: '+s.operation+'\nOMEZENÍ: '+(s.constraints||'(nezadána)')+'\n\nÚKOL: Navrhni mechanismus, který využije vztah mezi vstupy. Vysvětli příčinu a důsledek, stav systému, pravidla, výjimky a možné selhání. Pak navrhni nejmenší funkční prototyp a test s pozorovatelným výsledkem. U vědecké hypotézy uveď, co by ji vyvrátilo. Zachovej odděleně zdrojová data, interpretaci a ověřené závěry. Nepředstírej, že jsi načetl soubor pouze z uvedené cesty: text pohádky musí uživatel přiložit nebo vložit do vstupů, pokud ho model v daném rozhraní nemá k dispozici.';history.replaceState(null,'','#'+encode(s));$('status').textContent='Prompt vytvořen. Odkaz na soubor pohádky je relativní; model ho automaticky nečte, pokud mu text nepředáš.'}
$('generate').onclick=generate;$('url').onclick=()=>{location.hash=encode(state());$('status').textContent='Stav uložen do URL. Adresu lze sdílet.'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);$('status').textContent='Prompt zkopírován.'}catch(e){$('prompt').select();$('status').textContent='Vyber označený prompt a zkopíruj jej ručně.'}};$('download').onclick=()=>{let b=new Blob([JSON.stringify({schema:'mouse-room-card/1.0',created:new Date().toISOString(),...state()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='room-karta.json';a.click();URL.revokeObjectURL(a.href)};$('save').onclick=()=>{let r={id:'room-'+Date.now(),created:new Date().toISOString(),type:'generator',parent:null,...state(),observation:'',hypothesis:'',test:'',result:'nezahájeno'};let all=JSON.parse(localStorage.getItem('mouse_room_records')||'[]');all.push(r);localStorage.setItem('mouse_room_records',JSON.stringify(all));$('status').textContent='Uloženo do lokálního deníku ROOM. Otevři laboratoř a exportuj zálohu.'};
try{if(location.hash.length>1)apply(decode(location.hash.slice(1)))}catch(e){$('status').textContent='URL stav nelze načíst.'}
</script></body></html>
